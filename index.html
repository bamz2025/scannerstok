<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Scan QR Barang Keluar</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .header {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 1.25rem; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; opacity: 0.9; }
    .content { padding: 20px; }
    #wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #video, #canvas { width: 100%; height: 100%; object-fit: cover; }
    #overlay {
      position: absolute;
      inset: 0;
      border: 3px solid #22c55e;
      border-radius: 12px;
      pointer-events: none;
    }
    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #334155;
      display: none;
    }
    .result-box.show { display: block; }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #334155;
      font-size: 0.9rem;
    }
    .result-row:last-child { border-bottom: none; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-confirm { background: #16a34a; color: white; }
    .btn-confirm:disabled { background: #64748b; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-close { background: #dc2626; color: white; }
    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 0.9rem;
      padding: 10px;
      border-radius: 8px;
      background: #33415522;
      color: #94a3b8;
    }
    .status.err { white-space: pre-wrap; text-align: left; font-size: 0.8rem; }
    .form-group { margin-top: 12px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Scan QR Barang Keluar</h1>
      <p>Arahkan kamera ke QR Code label barang</p>
    </div>

    <div class="content">
      <div id="wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div id="overlay"></div>
      </div>

      <div class="result-box" id="resultBox">
        <div class="result-row"><span class="label">Nama Barang</span><span class="value" id="resNama">-</span></div>
        <div class="result-row"><span class="label">Kategori</span><span class="value" id="resKategori">-</span></div>
        <div class="result-row"><span class="label">Tgl Masuk</span><span class="value" id="resMasuk">-</span></div>
        <div class="result-row"><span class="label">Tgl Kadaluarsa</span><span class="value" id="resExp">-</span></div>

        <div class="form-group">
          <label>Jumlah Keluar</label>
          <input type="number" id="jumlahKeluar" value="1" min="1">
        </div>
        <div class="form-group">
          <label>Tujuan</label>
          <input type="text" id="tujuan" value="Scan QR" placeholder="Contoh: Lab, IGD, dll">
        </div>
        <div class="form-group">
          <label>Periode</label>
          <select id="periode">
            <option value="TW 1">TW 1</option>
            <option value="TW 2">TW 2</option>
            <option value="TW 3">TW 3</option>
            <option value="TW 4">TW 4</option>
          </select>
        </div>

        <button class="btn btn-confirm" id="btnConfirm" onclick="konfirmasiKeluar()">Konfirmasi &amp; Catat Keluar</button>
        <button class="btn btn-secondary" onclick="scanUlang()">Scan Ulang</button>
      </div>

      <p class="status" id="status">Memulai kamera...</p>

      <button class="btn btn-close" onclick="window.close()">Tutup</button>
    </div>
  </div>

  <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var statusEl = document.getElementById('status');
    var resultBox = document.getElementById('resultBox');
    var scanning = true;
    var currentStream = null;
    var scannedData = null;

    function updateStatus(msg, color, isError) {
      statusEl.textContent = msg;
      statusEl.style.background = color + '22';
      statusEl.style.color = color;
      statusEl.classList.toggle('err', !!isError);
    }

    function describeCameraError(err) {
      var msg = (err && (err.message || err.name)) || String(err);
      if (/NotAllowedError|Permission/i.test(msg)) {
        return 'Izin kamera ditolak. Izinkan akses kamera di pengaturan browser/situs, lalu reload halaman.';
      }
      if (/NotFoundError/i.test(msg)) {
        return 'Kamera tidak ditemukan di perangkat ini.';
      }
      if (/NotReadableError/i.test(msg)) {
        return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.';
      }
      return msg;
    }

    function startCamera() {
      var isSecure = window.isSecureContext ||
        location.protocol === 'https:' ||
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';
      if (!isSecure) {
        updateStatus(
          'Kamera tidak bisa diakses karena halaman ini bukan HTTPS (' + location.protocol + '//' + location.hostname + '). ' +
          'Buka lewat URL Web App Apps Script (https://...), bukan file lokal.',
          '#ef4444', true
        );
        return;
      }
      if (typeof jsQR === 'undefined') {
        updateStatus('Gagal memuat library jsQR (CDN jsdelivr tidak bisa diakses). Cek koneksi internet perangkat.', '#ef4444', true);
        return;
      }

      updateStatus('Meminta izin kamera...', '#3b82f6');

      // Constraint kamera lebih agresif untuk low-light & fokus
      var constraints = {
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          // Beberapa browser mendukung advanced constraints
          advanced: [
            { focusMode: 'continuous' },
            { exposureMode: 'continuous' },
            { whiteBalanceMode: 'continuous' }
          ]
        }
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
          currentStream = stream;
          video.srcObject = stream;
          video.setAttribute('playsinline', true);
          video.setAttribute('muted', true);

          // Coba naikkan brightness/exposure jika track mendukung
          try {
            var track = stream.getVideoTracks()[0];
            var capabilities = track.getCapabilities ? track.getCapabilities() : {};
            var settings = {};
            if (capabilities.exposureCompensation) {
              settings.exposureCompensation = Math.min(capabilities.exposureCompensation.max || 1, 1);
            }
            if (capabilities.brightness) {
              settings.brightness = Math.min(capabilities.brightness.max || 100, 70);
            }
            if (Object.keys(settings).length) {
              track.applyConstraints({ advanced: [settings] }).catch(function(){});
            }
          } catch (e) {}

          video.onloadedmetadata = function() {
            video.play().then(function() {
              scanning = true;
              updateStatus('Arahkan kamera ke QR Code', '#38bdf8');
              requestAnimationFrame(tick);
            }).catch(function() {
              updateStatus('Gagal memutar video kamera', '#ef4444', true);
            });
          };
        })
        .catch(function(err) {
          // Fallback constraint lebih sederhana jika advanced gagal
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(function(stream) {
              currentStream = stream;
              video.srcObject = stream;
              video.onloadedmetadata = function() {
                video.play();
                scanning = true;
                updateStatus('Arahkan kamera ke QR Code', '#38bdf8');
                requestAnimationFrame(tick);
              };
            })
            .catch(function(err2) {
              updateStatus('Gagal membuka kamera: ' + describeCameraError(err2 || err), '#ef4444', true);
            });
        });
    }

    // Pre-processing sederhana untuk meningkatkan kontras (bantu low-light & QR melengkung)
    function enhanceImageData(imageData) {
      var data = imageData.data;
      var len = data.length;
      // Tingkatkan kontras & brightness ringan
      var contrast = 1.35;
      var brightness = 18;
      for (var i = 0; i < len; i += 4) {
        var r = data[i];
        var g = data[i + 1];
        var b = data[i + 2];
        // grayscale dulu
        var gray = 0.299 * r + 0.587 * g + 0.114 * b;
        // contrast + brightness
        gray = (gray - 128) * contrast + 128 + brightness;
        if (gray < 0) gray = 0;
        if (gray > 255) gray = 255;
        data[i] = data[i + 1] = data[i + 2] = gray;
      }
      return imageData;
    }

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        // Coba scan normal dulu
        var code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'attemptBoth'   // lebih toleran terhadap warna terbalik / low contrast
        });

        // Jika gagal, coba versi yang sudah di-enhance (bantu cahaya kurang & QR melengkung)
        if (!code) {
          var enhanced = enhanceImageData(ctx.getImageData(0, 0, canvas.width, canvas.height));
          code = jsQR(enhanced.data, enhanced.width, enhanced.height, {
            inversionAttempts: 'attemptBoth'
          });
        }

        if (code && code.data) {
          onScanSuccess(code.data);
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    // Parser yang menerima format BARU maupun format LAMA
    function parseQrText(decodedText) {
      var text = (decodedText || '').trim();
      if (!text) return null;

      // === Format BARU (berlabel, multi-line) ===
      // Contoh:
      // KATEGORI : ...
      // NAMA BARANG : ...
      // TANGGAL MASUK : ...
      // TANGGAL EXPIRED : ...
      if (/KATEGORI\s*:/i.test(text) || /NAMA\s*BARANG\s*:/i.test(text)) {
        var result = {
          nama: '',
          kategori: '',
          tglMasuk: '',
          tglExp: ''
        };

        var lines = text.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;

          var mKat = line.match(/^KATEGORI\s*:\s*(.*)$/i);
          if (mKat) { result.kategori = mKat[1].trim(); continue; }

          var mNama = line.match(/^NAMA\s*BARANG\s*:\s*(.*)$/i);
          if (mNama) { result.nama = mNama[1].trim(); continue; }

          var mMasuk = line.match(/^TANGGAL\s*MASUK\s*:\s*(.*)$/i);
          if (mMasuk) { result.tglMasuk = mMasuk[1].trim(); continue; }

          var mExp = line.match(/^TANGGAL\s*(EXPIRED|EXP|KADALUARSA)\s*:\s*(.*)$/i);
          if (mExp) { result.tglExp = mExp[2].trim(); continue; }
        }

        // Minimal harus ada nama atau kategori
        if (result.nama || result.kategori) {
          return result;
        }
      }

      // === Format LAMA (pipe-separated) ===
      // Nama|Kategori|TglMasuk|TglExp
      if (text.indexOf('|') !== -1) {
        var parts = text.split('|');
        return {
          nama: (parts[0] || '').trim(),
          kategori: (parts[1] || '').trim(),
          tglMasuk: (parts[2] || '').trim(),
          tglExp: (parts[3] || '').trim()
        };
      }

      // Tidak dikenali
      return null;
    }

    function onScanSuccess(decodedText) {
      var parsed = parseQrText(decodedText);

      if (!parsed) {
        updateStatus('Format QR tidak dikenali:\n' + decodedText, '#ef4444', true);
        requestAnimationFrame(tick); // lanjut scan
        return;
      }

      scannedData = {
        nama: parsed.nama || '-',
        kategori: parsed.kategori || '-',
        tglMasuk: parsed.tglMasuk || '-',
        tglExp: parsed.tglExp || '-'
      };

      document.getElementById('resNama').textContent = scannedData.nama;
      document.getElementById('resKategori').textContent = scannedData.kategori;
      document.getElementById('resMasuk').textContent = scannedData.tglMasuk;
      document.getElementById('resExp').textContent = scannedData.tglExp;
      resultBox.classList.add('show');
      updateStatus('QR berhasil dibaca! Isi jumlah & tujuan lalu konfirmasi.', '#22c55e');

      if (navigator.vibrate) { try { navigator.vibrate(150); } catch (e) {} }

      stopCamera();
    }

    function stopCamera() {
      scanning = false;
      if (currentStream) {
        currentStream.getTracks().forEach(function(t) { t.stop(); });
        currentStream = null;
      }
    }

    function scanUlang() {
      scannedData = null;
      resultBox.classList.remove('show');
      var btn = document.getElementById('btnConfirm');
      btn.disabled = false;
      btn.textContent = 'Konfirmasi & Catat Keluar';
      startCamera();
    }

    function konfirmasiKeluar() {
      if (!scannedData || !scannedData.nama) {
        alert('Belum ada data QR yang discan');
        return;
      }

      var jumlah = parseInt(document.getElementById('jumlahKeluar').value, 10) || 1;
      var tujuan = document.getElementById('tujuan').value.trim() || 'Scan QR';
      var periode = document.getElementById('periode').value;

      if (jumlah < 1) {
        alert('Jumlah minimal 1');
        return;
      }

      var btn = document.getElementById('btnConfirm');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      updateStatus('Mengirim data ke server...', '#3b82f6');

      var payload = {
        nama: scannedData.nama,
        kategori: scannedData.kategori,
        tglExp: scannedData.tglExp,
        jumlah: jumlah,
        tujuan: tujuan,
        periode: periode
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'QR_SCAN_RESULT', data: payload }, '*');
          updateStatus('Data dikirim ke halaman Barang Keluar. Menutup...', '#22c55e');
          setTimeout(function() { window.close(); }, 800);
          return;
        }
      } catch (e) {
        // window.opener bisa null/terblokir
      }

      updateStatus('Buka dari menu Barang Keluar agar data otomatis tersimpan.', '#f59e0b');
      btn.disabled = false;
      btn.textContent = 'Konfirmasi & Catat Keluar';
      alert('Scan berhasil.\n\nNama: ' + scannedData.nama +
            '\nJumlah: ' + jumlah +
            '\nTujuan: ' + tujuan +
            '\n\nSilakan buka scanner ini dari tombol Scan QR di menu Barang Keluar agar data otomatis tercatat.');
    }

    window.addEventListener('beforeunload', stopCamera);
    startCamera();
  </script>
</body>
</html>
