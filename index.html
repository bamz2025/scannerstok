<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Scan QR Barang Keluar - Ultra Precision</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .header {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 1.25rem; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; opacity: 0.9; }
    .content { padding: 20px; }
    #wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #video, #canvas { width: 100%; height: 100%; object-fit: cover; }
    #overlay {
      position: absolute;
      inset: 0;
      border: 3px solid #22c55e;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(34, 197, 94, 0.3);
    }
    .scan-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e, 0 0 20px #22c55e;
      animation: moveScan 2s infinite linear;
      pointer-events: none;
    }
    @keyframes moveScan {
      0% { top: 5%; }
      50% { top: 95%; }
      100% { top: 5%; }
    }
    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #334155;
      display: none;
    }
    .result-box.show { display: block; }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #334155;
      font-size: 0.9rem;
    }
    .result-row:last-child { border-bottom: none; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-confirm { background: #16a34a; color: white; }
    .btn-confirm:disabled { background: #64748b; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-torch { background: #f59e0b; color: #0f172a; display: none; }
    .btn-torch.active { background: #fbbf24; }
    .btn-close { background: #dc2626; color: white; }
    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 0.9rem;
      padding: 10px;
      border-radius: 8px;
      background: #33415522;
      color: #94a3b8;
    }
    .status.err { white-space: pre-wrap; text-align: left; font-size: 0.8rem; }
    .form-group { margin-top: 12px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Scan QR Barang Keluar</h1>
      <p>Pindai otomatis (Mendukung Botol &amp; Gelap)</p>
    </div>
    <div class="content">
      <div id="wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div id="overlay">
          <div class="scan-line"></div>
        </div>
      </div>

      <!-- Tombol Senter -->
      <button class="btn btn-torch" id="btnTorch" onclick="toggleTorch()">🔦 Nyalakan Senter</button>

      <div class="result-box" id="resultBox">
        <div class="result-row"><span class="label">Nama Barang</span><span class="value" id="resNama">-</span></div>
        <div class="result-row"><span class="label">Kategori</span><span class="value" id="resKategori">-</span></div>
        <div class="result-row"><span class="label">Tgl Masuk</span><span class="value" id="resMasuk">-</span></div>
        <div class="result-row"><span class="label">Tgl Kadaluarsa</span><span class="value" id="resExp">-</span></div>
        <div class="form-group">
          <label>Jumlah Keluar</label>
          <input type="number" id="jumlahKeluar" value="1" min="1">
        </div>
        <div class="form-group">
          <label>Tujuan</label>
          <input type="text" id="tujuan" value="Scan QR" placeholder="Contoh: Lab, IGD, dll">
        </div>
        <div class="form-group">
          <label>Periode</label>
          <select id="periode">
            <option value="TW 1">TW 1</option>
            <option value="TW 2">TW 2</option>
            <option value="TW 3">TW 3</option>
            <option value="TW 4">TW 4</option>
          </select>
        </div>
        <button class="btn btn-confirm" id="btnConfirm" onclick="konfirmasiKeluar()">Konfirmasi &amp; Catat Keluar</button>
        <button class="btn btn-secondary" onclick="scanUlang()">Scan Ulang</button>
      </div>
      <p class="status" id="status">Memulai kamera...</p>
      <button class="btn btn-close" onclick="window.close()">Tutup</button>
    </div>
  </div>

  <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var statusEl = document.getElementById('status');
    var resultBox = document.getElementById('resultBox');
    var scanning = true;
    var currentStream = null;
    var scannedData = null;
    var torchOn = false;
    var track = null;
    var processPass = 0; // Rotasi/pipeline pass counter

    // ================= SUARA BEEP =================
    var audioCtx = null;
    function playBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var oscillator = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.25);
      } catch (e) {
        console.warn('Beep tidak bisa diputar:', e);
      }
    }

    function updateStatus(msg, color, isError) {
      statusEl.textContent = msg;
      statusEl.style.background = color + '22';
      statusEl.style.color = color;
      statusEl.classList.toggle('err', !!isError);
    }

    function describeCameraError(err) {
      var msg = (err && (err.message || err.name)) || String(err);
      if (/NotAllowedError|Permission/i.test(msg)) {
        return 'Izin kamera ditolak. Izinkan akses kamera di pengaturan browser/situs, lalu reload halaman.';
      }
      if (/NotFoundError/i.test(msg)) {
        return 'Kamera tidak ditemukan di perangkat ini.';
      }
      if (/NotReadableError/i.test(msg)) {
        return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.';
      }
      return msg;
    }

    // ================= ADVANCED IMAGE PROCESSING =================
    // 1. Adaptive Thresholding & Anti-Glare (Sangat ampuh untuk pantulan cahaya & gelap)
    function applyAdaptiveThreshold(imageData) {
      var data = imageData.data;
      var width = imageData.width;
      var height = imageData.height;
      var gray = new Uint8Array(width * height);

      // Konversi ke Grayscale & Tekan Glare (Pantulan Berlebih)
      for (var i = 0, j = 0; i < data.length; i += 4, j++) {
        var r = data[i], g = data[i+1], b = data[i+2];
        
        // Deteksi Glare (piksel yang terlalu menyala putih karena pantulan)
        if (r > 235 && g > 235 && b > 235) {
          gray[j] = 128; // Netralkan area kilau agar kontras tidak hancur
        } else {
          gray[j] = (0.299 * r + 0.587 * g + 0.114 * b);
        }
      }

      // Local Adaptive Binarization (Mengatasi Gelap / Bayangan Tidak Merata)
      var blockSize = 15;
      var halfBlock = Math.floor(blockSize / 2);

      for (var y = 0; y < height; y += 2) { // Sampling lompat 2 piksel untuk kinerja cepat
        for (var x = 0; x < width; x += 2) {
          var sum = 0, count = 0;

          // Hitung rata-rata lokal sekitarnya
          for (var ky = -halfBlock; ky <= halfBlock; ky += 3) {
            var py = y + ky;
            if (py < 0 || py >= height) continue;
            for (var kx = -halfBlock; kx <= halfBlock; kx += 3) {
              var px = x + kx;
              if (px < 0 || px >= width) continue;
              sum += gray[py * width + px];
              count++;
            }
          }

          var localAvg = sum / count;
          var idx = (y * width + x);
          var val = gray[idx] < (localAvg - 4) ? 0 : 255;

          var pxIdx = idx * 4;
          data[pxIdx] = data[pxIdx + 1] = data[pxIdx + 2] = val;
        }
      }
      return imageData;
    }

    // 2. High Contrast & Auto Gamma Boost (Untuk Ruangan Super Gelap)
    function applyExtremeLowLightEnhance(imageData) {
      var data = imageData.data;
      var len = data.length;

      for (var i = 0; i < len; i += 4) {
        var r = data[i], g = data[i+1], b = data[i+2];
        var luma = 0.299 * r + 0.587 * g + 0.114 * b;

        // Apply Power Law (Gamma Correction) & Contrast stretch
        var enhanced = Math.pow(luma / 255, 0.5) * 255; // Gamma 0.5 menaikkan detail gelap
        enhanced = ((enhanced - 128) * 1.6) + 128; // Boost Kontras

        enhanced = Math.min(255, Math.max(0, enhanced));
        data[i] = data[i+1] = data[i+2] = enhanced;
      }
      return imageData;
    }

    // ================= KAMERA =================
    function startCamera() {
      var isSecure = window.isSecureContext ||
        location.protocol === 'https:' ||
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';
      if (!isSecure) {
        updateStatus(
          'Kamera tidak bisa diakses karena halaman ini bukan HTTPS (' + location.protocol + '//' + location.hostname + '). ' +
          'Buka lewat URL Web App Apps Script (https://...), bukan file lokal.',
          '#ef4444', true
        );
        return;
      }
      if (typeof jsQR === 'undefined') {
        updateStatus('Gagal memuat library jsQR. Cek koneksi internet perangkat.', '#ef4444', true);
        return;
      }

      updateStatus('Meminta izin kamera...', '#3b82f6');

      var constraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width: { min: 640, ideal: 1280, max: 1920 },
          height: { min: 480, ideal: 720, max: 1080 },
          advanced: [
            { focusMode: 'continuous' },
            { exposureMode: 'continuous' },
            { whiteBalanceMode: 'continuous' }
          ]
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
          currentStream = stream;
          video.srcObject = stream;
          track = stream.getVideoTracks()[0];

          var capabilities = track.getCapabilities ? track.getCapabilities() : {};
          if (capabilities.torch) {
            document.getElementById('btnTorch').style.display = 'block';
          }

          video.onloadedmetadata = function() {
            video.play();
            scanning = true;
            updateStatus('Siap memindai (Botol, Gelap, & Pantulan Cahaya)', '#38bdf8');
            requestAnimationFrame(tick);
          };
        })
        .catch(function(err) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(function(stream) {
              currentStream = stream;
              video.srcObject = stream;
              track = stream.getVideoTracks()[0];
              video.onloadedmetadata = function() {
                video.play();
                scanning = true;
                updateStatus('Arahkan kamera ke QR Code', '#38bdf8');
                requestAnimationFrame(tick);
              };
            })
            .catch(function(err2) {
              updateStatus('Gagal membuka kamera: ' + describeCameraError(err2), '#ef4444', true);
            });
        });
    }

    function toggleTorch() {
      if (!track) return;
      torchOn = !torchOn;
      track.applyConstraints({
        advanced: [{ torch: torchOn }]
      }).then(function() {
        var btn = document.getElementById('btnTorch');
        if (torchOn) {
          btn.textContent = '🔦 Matikan Senter';
          btn.classList.add('active');
        } else {
          btn.textContent = '🔦 Nyalakan Senter';
          btn.classList.remove('active');
        }
      }).catch(function(e) {
        console.warn('Torch tidak didukung:', e);
        updateStatus('Senter tidak didukung di perangkat ini', '#f59e0b');
      });
    }

    // ================= LOOPING PEMINDAIAN MULTI-PASS =================
    function tick() {
      if (!scanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // Pass 0 & 1: Normal Crop
        // Pass 2: Center Zoom Crop (Sangat efektif untuk lengkungan botol)
        var cropX = 0, cropY = 0, cropW = canvas.width, cropH = canvas.height;
        
        processPass = (processPass + 1) % 4;

        if (processPass === 2) {
          // Crop 60% area tengah untuk menangani kelengkungan botol yang terdistorsi di pinggir
          cropW = Math.floor(canvas.width * 0.6);
          cropH = Math.floor(canvas.height * 0.6);
          cropX = Math.floor((canvas.width - cropW) / 2);
          cropY = Math.floor((canvas.height - cropH) / 2);
        }

        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        // Pipeline Bergantian untuk Kinerja Maksimal Tanpa Lag
        if (processPass === 1) {
          // Terapkan Enhancer Low-Light
          imageData = applyExtremeLowLightEnhance(imageData);
        } else if (processPass === 3) {
          // Terapkan Anti-Glare & Adaptive Thresholding
          imageData = applyAdaptiveThreshold(imageData);
        }

        // Panggil jsQR dengan pencarian ganda (Normal & Inverted)
        var code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'attemptBoth'
        });

        if (code && code.data) {
          onScanSuccess(code.data);
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    // ================= PARSER QR =================
    function parseQrData(decodedText) {
      var text = (decodedText || '').trim();
      var result = {
        nama: '',
        kategori: '',
        tglMasuk: '',
        tglExp: ''
      };

      if (/KATEGORI\s*:/i.test(text) || /NAMA\s*BARANG\s*:/i.test(text)) {
        var lines = text.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;

          var mKat = line.match(/^KATEGORI\s*:\s*(.*)$/i);
          if (mKat) { result.kategori = mKat[1].trim(); continue; }

          var mNama = line.match(/^NAMA\s*BARANG\s*:\s*(.*)$/i);
          if (mNama) { result.nama = mNama[1].trim(); continue; }

          var mMasuk = line.match(/^TANGGAL\s*MASUK\s*:\s*(.*)$/i);
          if (mMasuk) { result.tglMasuk = mMasuk[1].trim(); continue; }

          var mExp = line.match(/^TANGGAL\s*EXPIRED\s*:\s*(.*)$/i);
          if (mExp) { result.tglExp = mExp[1].trim(); continue; }
        }
        return result;
      }

      if (text.indexOf('|') !== -1) {
        var parts = text.split('|');
        result.nama     = (parts[0] || '').trim();
        result.kategori = (parts[1] || '').trim();
        result.tglMasuk = (parts[2] || '').trim();
        result.tglExp   = (parts[3] || '').trim();
        return result;
      }

      return null;
    }

    function onScanSuccess(decodedText) {
      var parsed = parseQrData(decodedText);

      if (!parsed || (!parsed.nama && !parsed.kategori)) {
        updateStatus('Format QR tidak dikenali:\n' + decodedText, '#ef4444', true);
        requestAnimationFrame(tick);
        return;
      }

      playBeep();

      scannedData = {
        nama: parsed.nama || '-',
        kategori: parsed.kategori || '-',
        tglMasuk: parsed.tglMasuk || '-',
        tglExp: parsed.tglExp || '-'
      };

      document.getElementById('resNama').textContent = scannedData.nama;
      document.getElementById('resKategori').textContent = scannedData.kategori;
      document.getElementById('resMasuk').textContent = scannedData.tglMasuk;
      document.getElementById('resExp').textContent = scannedData.tglExp;

      resultBox.classList.add('show');
      updateStatus('QR berhasil dibaca! Isi jumlah & tujuan lalu konfirmasi.', '#22c55e');

      if (navigator.vibrate) {
        try { navigator.vibrate(150); } catch (e) {}
      }

      if (torchOn && track) {
        track.applyConstraints({ advanced: [{ torch: false }] }).catch(function(){});
        torchOn = false;
      }

      stopCamera();
    }

    function stopCamera() {
      scanning = false;
      if (currentStream) {
        currentStream.getTracks().forEach(function(t) { t.stop(); });
        currentStream = null;
      }
      track = null;
    }

    function scanUlang() {
      scannedData = null;
      resultBox.classList.remove('show');
      var btn = document.getElementById('btnConfirm');
      btn.disabled = false;
      btn.textContent = 'Konfirmasi & Catat Keluar';
      document.getElementById('btnTorch').style.display = 'none';
      document.getElementById('btnTorch').textContent = '🔦 Nyalakan Senter';
      document.getElementById('btnTorch').classList.remove('active');
      torchOn = false;
      startCamera();
    }

    function konfirmasiKeluar() {
      if (!scannedData || !scannedData.nama) {
        alert('Belum ada data QR yang discan');
        return;
      }
      var jumlah = parseInt(document.getElementById('jumlahKeluar').value, 10) || 1;
      var tujuan = document.getElementById('tujuan').value.trim() || 'Scan QR';
      var periode = document.getElementById('periode').value;
      if (jumlah < 1) {
        alert('Jumlah minimal 1');
        return;
      }
      var btn = document.getElementById('btnConfirm');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      updateStatus('Mengirim data ke server...', '#3b82f6');

      var payload = {
        nama: scannedData.nama,
        kategori: scannedData.kategori,
        tglExp: scannedData.tglExp,
        jumlah: jumlah,
        tujuan: tujuan,
        periode: periode
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'QR_SCAN_RESULT', data: payload }, '*');
          updateStatus('Data dikirim ke halaman Barang Keluar. Menutup...', '#22c55e');
          setTimeout(function() { window.close(); }, 800);
          return;
        }
      } catch (e) {}

      updateStatus('Buka dari menu Barang Keluar agar data otomatis tersimpan.', '#f59e0b');
      btn.disabled = false;
      btn.textContent = 'Konfirmasi & Catat Keluar';
      alert('Scan berhasil.\n\nNama: ' + scannedData.nama +
            '\nJumlah: ' + jumlah +
            '\nTujuan: ' + tujuan +
            '\n\nSilakan buka scanner ini dari tombol Scan QR di menu Barang Keluar agar data otomatis tercatat.');
    }

    window.addEventListener('beforeunload', stopCamera);
    startCamera();
  </script>
</body>
</html>
