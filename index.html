<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Scan QR Barang Keluar</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .header {
      background: linear-gradient(135deg, #0d9488, #0f766e);
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 1.2rem; margin-bottom: 4px; color: #fff; }
    .header p { font-size: 0.8rem; opacity: 0.9; color: #ccfbf1; }
    .content { padding: 18px; }
    #wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #video, #canvas { width: 100%; height: 100%; object-fit: cover; }
    #overlay {
      position: absolute;
      inset: 0;
      border: 3px solid #14b8a6;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(20, 184, 166, 0.3);
    }
    .scan-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: #14b8a6;
      box-shadow: 0 0 10px #14b8a6, 0 0 20px #14b8a6;
      animation: moveScan 2s infinite linear;
      pointer-events: none;
    }
    @keyframes moveScan {
      0% { top: 5%; }
      50% { top: 95%; }
      100% { top: 5%; }
    }
    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #334155;
      display: none;
    }
    .result-box.show { display: block; }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #334155;
      font-size: 0.88rem;
    }
    .result-row:last-child { border-bottom: none; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; color: #f8fafc; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-confirm { background: #0d9488; color: white; }
    .btn-confirm:disabled { background: #64748b; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-torch { background: #f59e0b; color: #0f172a; display: none; }
    .btn-torch.active { background: #fbbf24; }
    .btn-close { background: #dc2626; color: white; }
    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 8px;
      background: #33415522;
      color: #94a3b8;
    }
    .status.err { white-space: pre-wrap; text-align: left; font-size: 0.8rem; }
    .form-group { margin-top: 10px; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SCAN QR BARANG KELUAR</h1>
      <p>LAB TERPADU RSSM</p>
    </div>
    <div class="content">
      <div id="wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div id="overlay">
          <div class="scan-line"></div>
        </div>
      </div>

      <button class="btn btn-torch" id="btnTorch" onclick="toggleTorch()">🔦 Nyalakan Senter</button>

      <div class="result-box" id="resultBox">
        <div class="result-row"><span class="label">Nama Barang</span><span class="value" id="resNama">-</span></div>
        <div class="result-row"><span class="label">Kategori</span><span class="value" id="resKategori">-</span></div>
        <div class="result-row"><span class="label">Tgl Masuk</span><span class="value" id="resMasuk">-</span></div>
        <div class="result-row"><span class="label">Tgl Kadaluarsa</span><span class="value" id="resExp">-</span></div>
        <div class="form-group">
          <label>Jumlah Keluar</label>
          <input type="number" id="jumlahKeluar" value="1" min="1">
        </div>
        <div class="form-group">
          <label>Tujuan</label>
          <input type="text" id="tujuan" value="Scan QR" placeholder="Contoh: Lab, IGD, dll">
        </div>
        <div class="form-group">
          <label>Periode</label>
          <select id="periode">
            <option value="TW 1">TW 1</option>
            <option value="TW 2">TW 2</option>
            <option value="TW 3">TW 3</option>
            <option value="TW 4">TW 4</option>
          </select>
        </div>
        <button class="btn btn-confirm" id="btnConfirm" onclick="konfirmasiKeluar()">Konfirmasi &amp; Catat Keluar</button>
        <button class="btn btn-secondary" onclick="scanUlang()">Scan Ulang</button>
      </div>
      <p class="status" id="status">Memulai kamera...</p>
      <button class="btn btn-close" onclick="window.close()">Tutup</button>
    </div>
  </div>

  <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var statusEl = document.getElementById('status');
    var resultBox = document.getElementById('resultBox');
    var scanning = true;
    var currentStream = null;
    var scannedData = null;
    var torchOn = false;
    var track = null;
    var passCounter = 0;

    // AUDIO BEEP
    var audioCtx = null;
    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    function updateStatus(msg, color, isError) {
      statusEl.textContent = msg;
      statusEl.style.background = color + '22';
      statusEl.style.color = color;
      statusEl.classList.toggle('err', !!isError);
    }

    // ================= HIGH PERFORMANCE IMAGE PIPELINE =================

    // 1. Histogram Equalization & Gain Boost (Khusus Ruangan Sangat Gelap)
    function enhanceLowLight(imgData) {
      var d = imgData.data;
      var len = d.length;
      var min = 255, max = 0;

      // Cari min & max luminance
      for (var i = 0; i < len; i += 4) {
        var lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        if (lum < min) min = lum;
        if (lum > max) max = lum;
      }

      // Jika kondisi sangat gelap (max luminance rendah)
      if (max < 130) {
        var range = (max - min) || 1;
        for (var j = 0; j < len; j += 4) {
          var gray = 0.299 * d[j] + 0.587 * d[j+1] + 0.114 * d[j+2];
          // Stretching & Gamma 0.6
          var normalized = (gray - min) / range;
          var boosted = Math.pow(normalized, 0.6) * 255;
          d[j] = d[j+1] = d[j+2] = Math.min(255, Math.max(0, boosted));
        }
      }
      return imgData;
    }

    // 2. Anti-Glare & Bradley Adaptive Thresholding (Presisi Tinggi)
    function suppressGlareAndBinarize(imgData) {
      var d = imgData.data;
      var w = imgData.width;
      var h = imgData.height;
      var gray = new Uint8Array(w * h);

      // Conversi Grayscale & Deteksi Glare
      for (var i = 0, j = 0; i < d.length; i += 4, j++) {
        var r = d[i], g = d[i+1], b = d[i+2];
        // Jika Glare ekstrim (pantulan lampu putih mendatar)
        if (r > 240 && g > 240 && b > 240) {
          gray[j] = (r + g + b) / 3; 
        } else {
          gray[j] = (0.299 * r + 0.587 * g + 0.114 * b);
        }
      }

      // Bradley Local Thresholding menggunakan Integral Image
      var intImg = new Uint32Array(w * h);
      var sum = 0;
      for (var x = 0; x < w; x++) {
        sum = 0;
        for (var y = 0; y < h; y++) {
          sum += gray[y * w + x];
          if (x === 0) intImg[y * w + x] = sum;
          else intImg[y * w + x] = intImg[y * w + (x - 1)] + sum;
        }
      }

      var S = Math.floor(w / 8);
      var T = 15; // Tingkat sensitivitas kontras
      var s2 = Math.floor(S / 2);

      for (var y0 = 0; y0 < h; y0++) {
        for (var x0 = 0; x0 < w; x0++) {
          var x1 = Math.max(x0 - s2, 0);
          var x2 = Math.min(x0 + s2, w - 1);
          var y1 = Math.max(y0 - s2, 0);
          var y2 = Math.min(y0 + s2, h - 1);
          var count = (x2 - x1) * (y2 - y1);
          var total = intImg[y2 * w + x2] - intImg[y1 * w + x2] - intImg[y2 * w + x1] + intImg[y1 * w + x1];

          var idx = (y0 * w + x0) * 4;
          var val = (gray[y0 * w + x0] * count) < (total * (100 - T) / 100) ? 0 : 255;
          d[idx] = d[idx+1] = d[idx+2] = val;
        }
      }
      return imgData;
    }

    // ================= KAMERA SETUP (DESKTOP & MOBILE) =================
    function startCamera() {
      if (typeof jsQR === 'undefined') {
        updateStatus('Library jsQR gagal dimuat. Periksa koneksi internet.', '#ef4444', true);
        return;
      }

      updateStatus('Membuka kamera...', '#3b82f6');

      // Universal Constraints (Kompatibel Webcam PC & Kamera HP)
      var constraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
          currentStream = stream;
          video.srcObject = stream;
          track = stream.getVideoTracks()[0];

          // Cek dukungan Senter (Mobile Only)
          try {
            var capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
              document.getElementById('btnTorch').style.display = 'block';
            }
          } catch(e) {}

          video.onloadedmetadata = function() {
            video.play();
            scanning = true;
            updateStatus('Siap Memindai', '#0d9488');
            requestAnimationFrame(tick);
          };
        })
        .catch(function(err) {
          // Fallback sederhana jika constraints ideal ditolak
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function(stream) {
              currentStream = stream;
              video.srcObject = stream;
              video.play();
              scanning = true;
              updateStatus('Kamera Standar Aktif. Arahkan ke QR.', '#0d9488');
              requestAnimationFrame(tick);
            })
            .catch(function(err2) {
              updateStatus('Akses kamera gagal: ' + (err2.message || err2.name), '#ef4444', true);
            });
        });
    }

    function toggleTorch() {
      if (!track) return;
      torchOn = !torchOn;
      track.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function() {
        var btn = document.getElementById('btnTorch');
        btn.textContent = torchOn ? '🔦 Matikan Senter' : '🔦 Nyalakan Senter';
        btn.classList.toggle('active', torchOn);
      }).catch(function(){});
    }

    // ================= LOOP DEKODER MULTI-PASS =================
    function tick() {
      if (!scanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        var vW = video.videoWidth;
        var vH = video.videoHeight;

        // Atur ukuran canvas konsisten dengan resolusi asli video
        if (canvas.width !== vW || canvas.height !== vH) {
          canvas.width = vW;
          canvas.height = vH;
        }

        passCounter = (passCounter + 1) % 4;

        // Pilihan Region of Interest (ROI) & Crop
        var sx = 0, sy = 0, sW = vW, sH = vH;

        if (passCounter === 2) {
          // Crop 65% Tengah (Menghilangkan distorsi lengkungan botol di pinggir)
          sW = Math.floor(vW * 0.65);
          sH = Math.floor(vH * 0.65);
          sx = Math.floor((vW - sW) / 2);
          sy = Math.floor((vH - sH) / 2);
        }

        ctx.drawImage(video, sx, sy, sW, sH, 0, 0, canvas.width, canvas.height);
        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        // PIPELINE BERGANTIAN (Anti-Lag PC/HP)
        if (passCounter === 1) {
          // Pass Low-Light (Ruangan Gelap)
          imgData = enhanceLowLight(imgData);
        } else if (passCounter === 3) {
          // Pass Adaptive Threshold & Anti Glare
          imgData = suppressGlareAndBinarize(imgData);
        }

        // Panggil jsQR
        var code = jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts: 'attemptBoth'
        });

        if (code && code.data) {
          onScanSuccess(code.data);
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    // ================= PARSER & ACTION =================
    function parseQrData(decodedText) {
      var text = (decodedText || '').trim();
      var result = { nama: '', kategori: '', tglMasuk: '', tglExp: '' };

      if (/KATEGORI\s*:/i.test(text) || /NAMA\s*BARANG\s*:/i.test(text)) {
        var lines = text.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;
          var mKat = line.match(/^KATEGORI\s*:\s*(.*)$/i);
          if (mKat) { result.kategori = mKat[1].trim(); continue; }
          var mNama = line.match(/^NAMA\s*BARANG\s*:\s*(.*)$/i);
          if (mNama) { result.nama = mNama[1].trim(); continue; }
          var mMasuk = line.match(/^TANGGAL\s*MASUK\s*:\s*(.*)$/i);
          if (mMasuk) { result.tglMasuk = mMasuk[1].trim(); continue; }
          var mExp = line.match(/^TANGGAL\s*EXPIRED\s*:\s*(.*)$/i);
          if (mExp) { result.tglExp = mExp[1].trim(); continue; }
        }
        return result;
      }

      if (text.indexOf('|') !== -1) {
        var parts = text.split('|');
        result.nama     = (parts[0] || '').trim();
        result.kategori = (parts[1] || '').trim();
        result.tglMasuk = (parts[2] || '').trim();
        result.tglExp   = (parts[3] || '').trim();
        return result;
      }

      // Jika format text biasa/bebas
      if (text.length > 0) {
        result.nama = text;
        return result;
      }

      return null;
    }

    function onScanSuccess(decodedText) {
      var parsed = parseQrData(decodedText);
      if (!parsed || !parsed.nama) {
        updateStatus('Format QR tidak dikenali:\n' + decodedText, '#ef4444', true);
        requestAnimationFrame(tick);
        return;
      }

      playBeep();

      scannedData = {
        nama: parsed.nama || '-',
        kategori: parsed.kategori || '-',
        tglMasuk: parsed.tglMasuk || '-',
        tglExp: parsed.tglExp || '-'
      };

      document.getElementById('resNama').textContent = scannedData.nama;
      document.getElementById('resKategori').textContent = scannedData.kategori;
      document.getElementById('resMasuk').textContent = scannedData.tglMasuk;
      document.getElementById('resExp').textContent = scannedData.tglExp;

      resultBox.classList.add('show');
      updateStatus('QR Berhasil Dibaca!', '#22c55e');

      if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}

      stopCamera();
    }

    function stopCamera() {
      scanning = false;
      if (currentStream) {
        currentStream.getTracks().forEach(function(t) { t.stop(); });
        currentStream = null;
      }
      track = null;
    }

    function scanUlang() {
      scannedData = null;
      resultBox.classList.remove('show');
      var btn = document.getElementById('btnConfirm');
      btn.disabled = false;
      btn.textContent = 'Konfirmasi & Catat Keluar';
      startCamera();
    }

    function konfirmasiKeluar() {
      if (!scannedData || !scannedData.nama) {
        alert('Belum ada data QR!');
        return;
      }
      var jumlah = parseInt(document.getElementById('jumlahKeluar').value, 10) || 1;
      var tujuan = document.getElementById('tujuan').value.trim() || 'Scan QR';
      var periode = document.getElementById('periode').value;

      var btn = document.getElementById('btnConfirm');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      var payload = {
        nama: scannedData.nama,
        kategori: scannedData.kategori,
        tglExp: scannedData.tglExp,
        jumlah: jumlah,
        tujuan: tujuan,
        periode: periode
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'QR_SCAN_RESULT', data: payload }, '*');
          updateStatus('Data terkirim. Menutup...', '#22c55e');
          setTimeout(function() { window.close(); }, 600);
          return;
        }
      } catch (e) {}

      alert('Scan Berhasil:\n\nNama: ' + scannedData.nama + '\nJumlah: ' + jumlah + '\nTujuan: ' + tujuan);
      btn.disabled = false;
      btn.textContent = 'Konfirmasi & Catat Keluar';
    }

    window.addEventListener('beforeunload', stopCamera);
    startCamera();
  </script>
</body>
</html>
